name: Kumkum Payal CI

on:
  push:
    branches: [ main, 'feat/*' ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate-and-build:
    name: Lint, Test & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/api/package.json

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.yml config

      - name: Install & Test NestJS API
        run: |
          cd apps/api
          npm ci --legacy-peer-deps
          npm run test
          npm run build

      - name: Install & Build React Vite Web App
        run: |
          cd apps/web
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker API & Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          tags: kumkum-payal-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile.web
          push: false
          tags: kumkum-payal-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
