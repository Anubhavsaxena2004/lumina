version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      target: development
    container_name: kumkum_web_dev
    environment:
      NODE_ENV: development
      VITE_API_URL: http://api:4000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
