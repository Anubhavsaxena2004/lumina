version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/api:/usr/src/app
      - /usr/src/app/node_modules
    command: ["npm", "run", "start:dev"]

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      target: builder
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
